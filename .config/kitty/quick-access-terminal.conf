# kitty's built-in Quake-style quick access terminal.
#
# Toggled by Hammerspoon (alt+s). Colours, font and keybindings are inherited
# from the normal kitty.conf, so only the panel geometry lives here.

# Drop down from the top of the screen.
edge top

# Height in rows. Roughly the top third of a laptop display.
lines 25

# Float above full-screen windows.
layer overlay

background_opacity 0.95

# Stay put when focus moves elsewhere, matching the Hyprland special
# workspace this replaces. Set to `yes` for classic hide-on-blur behaviour.
hide_on_focus_loss no

# The window is created on first toggle, not at login.
start_as_hidden yes
