onboarding = false
# Herdr config — tmux-compatible keybinds
# Mirrors .config/tmux/tmux.conf so muscle memory transfers.

[keys]
# Match tmux prefix (tmux.conf: unbind C-b; set-option -g prefix C-a)
prefix = "ctrl+a"


# Splits: | and - (tmux: bind | split-window -h; bind - split-window -v)
split_vertical = ["prefix+|", "prefix+\\"]
split_horizontal = "prefix+minus"

# Copy mode on v (tmux: bind v copy-mode)
copy_mode = "prefix+v"

# Reload on prefix+r (tmux: bind r source-file ...)
reload_config = "prefix+r"

# Pane nav via prefix+h/j/k/l (herdr defaults, kept as-is)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Last pane on ctrl+\ (tmux: C-\ select-pane -l)
last_pane = "ctrl+\\"

# Rename the current tab with prefix+shift+r.
rename_tab = "prefix+shift+r"
rename_pane = ""

# Switch visible sidebar workspaces with prefix+shift+1 through prefix+shift+9.
switch_workspace = "prefix+shift+1..9"

# ---
# Vim-aware pane navigation: ctrl+h/j/k/l with passthrough to vim.
# Uses vendored vim-herdr-navigation plugin at
# .config/herdr/plugins/vim-herdr-navigation/
# ---
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Workstreams: Bubble Tea overlay for worktree lifecycle, OMP state, and refs.
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "workstreams.open"
description = "Open workstreams"

# Unified Herdr palette: native actions, plugin actions, workspaces, and tabs.
[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "workstreams.palette"
description = "Open Herdr palette"

[ui]
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
rows = [["state_icon", "$workstream_number", "$workstream_id", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "system"
