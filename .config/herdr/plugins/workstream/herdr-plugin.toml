id = "workstream"
name = "Workstream"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Workstream creation (Jira / PR / fast git-ns overlay worktrees) and pause-restore lifecycle."
platforms = ["linux", "macos"]

# Architecture: keybound [[actions]] run on the herdr server WITHOUT a TTY,
# so interactive pickers (fzf, prompts) cannot run there. Each action calls
# open-pane.sh, which opens the matching [[panes]] entrypoint — those get a
# real terminal. This mirrors the command-palette plugin's pattern.
#
# Pane commands use $HERDR_PLUGIN_ROOT for absolute script paths, because
# open-pane.sh forwards the popup's cwd to the origin repo (so a relative
# path would not resolve).

# --- Popup panes (have a TTY; where the interactive UI actually runs) ---

[[panes]]
id = "from-pr"
title = "New workstream from PR"
placement = "popup"
width = "70%"
height = "50%"
command = ["bash", "-c", "exec bun \"$HERDR_PLUGIN_ROOT/bin/action.ts\" from-pr"]

[[panes]]
id = "from-jira"
title = "New workstream from Jira"
placement = "popup"
width = "60%"
height = "30%"
command = ["bash", "-c", "exec bun \"$HERDR_PLUGIN_ROOT/bin/action.ts\" from-jira"]

[[panes]]
id = "restore"
title = "Restore paused workstream"
placement = "popup"
width = "60%"
height = "40%"
command = ["bash", "-c", "exec bun \"$HERDR_PLUGIN_ROOT/bin/action.ts\" restore"]

[[panes]]
id = "fast-create"
title = "Fast worktree (git-ns overlay)"
placement = "popup"
width = "60%"
height = "20%"
command = ["bash", "-c", "exec bun \"$HERDR_PLUGIN_ROOT/bin/fast-create-prompt.ts\""]

# --- Actions (no TTY; open the popup panes above) ---

[[actions]]
id = "from-pr"
title = "New workstream from PR"
contexts = ["workspace"]
command = ["bash", "open-pane.sh", "from-pr", "popup"]

[[actions]]
id = "from-jira"
title = "New workstream from Jira"
contexts = ["workspace"]
command = ["bash", "open-pane.sh", "from-jira", "popup"]

[[actions]]
id = "restore"
title = "Restore paused workspace"
contexts = ["workspace"]
command = ["bash", "open-pane.sh", "restore", "popup"]

[[actions]]
id = "fast-create"
title = "Fast worktree (git-ns overlay)"
contexts = ["workspace"]
command = ["bash", "open-pane.sh", "fast-create", "popup"]

# pause is non-interactive (no picker): it snapshots + closes the focused
# workspace directly, so it can run as a plain action without a popup.
[[actions]]
id = "pause"
title = "Pause workspace (keep worktree)"
contexts = ["workspace"]
command = ["bun", "bin/action.ts", "pause"]
