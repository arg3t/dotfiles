id = "flow"
name = "Flow"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Workflow phases, almanac linked references, and an MCP server for agent orchestration."
platforms = ["linux", "macos"]

# Keep the focused workspace's almanac token fresh on switches.
[[events]]
on = "workspace.focused"
command = ["bun", "bin/action.ts", "almanac-sync"]

[[events]]
on = "worktree.opened"
command = ["bun", "bin/action.ts", "almanac-sync"]

[[actions]]
id = "cycle-phase"
title = "Cycle phase"
contexts = ["workspace"]
command = ["bun", "bin/action.ts", "cycle-phase"]

[[actions]]
id = "clear-phase"
title = "Clear phase"
contexts = ["workspace"]
command = ["bun", "bin/action.ts", "clear-phase"]

[[actions]]
id = "almanac-attach"
title = "Attach almanac reference"
contexts = ["workspace"]
command = ["bun", "bin/action.ts", "almanac-attach"]

# almanac-search is interactive (fzf), so it opens a popup pane — same
# no-TTY-on-actions pattern as the workstream plugin.
[[actions]]
id = "almanac-search"
title = "Search almanac"
contexts = ["workspace"]
command = ["bash", "open-pane.sh", "almanac-search", "popup"]

# set-phase as an action opens the interactive picker popup.
[[actions]]
id = "set-phase"
title = "Set phase (picker)"
contexts = ["workspace"]
command = ["bash", "open-pane.sh", "pick-phase", "popup"]

# --- Popup panes (have a TTY) ---

[[panes]]
id = "almanac-search"
title = "Search almanac"
placement = "popup"
width = "60%"
height = "40%"
command = ["bash", "-c", "exec bun \"$HERDR_PLUGIN_ROOT/bin/almanac-search-picker.ts\""]

# Interactive phase picker as a popup.
[[panes]]
id = "pick-phase"
title = "Set phase"
placement = "popup"
width = "40%"
height = "40%"
command = ["bash", "-c", "exec bun \"$HERDR_PLUGIN_ROOT/bin/action.ts\" pick-phase"]
